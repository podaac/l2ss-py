# This is the main build pipeline that verifies and publishes the software
name: Build
# Controls when the workflow will run
on:
  # Triggers the workflow on push events
  push:
    branches: [ develop, release/**, main, feature/**, issue/**, issues/**, dependabot/** ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # First job in the workflow installs and verifies the software
  build:
    name: Build, Test, Verify, Publish
    timeout-minutes: 60  # stops this job after 60 minutes
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 2.3.2
      - name: Get version
        id: get-version
        run: |
          echo "current_version=$(poetry version | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "pyproject_name=$(poetry version | awk '{print $1}')" >> $GITHUB_ENV
      - name: Bump pre-alpha version
        if: startsWith(github.ref, 'refs/heads/issue') || startsWith(github.ref, 'refs/heads/dependabot/') || startsWith(github.ref, 'refs/heads/feature/')
        run: |
          new_ver="${{ steps.get-version.outputs.current_version }}+$(git rev-parse --short ${GITHUB_SHA})"
          poetry version $new_ver
          echo "software_version=$(poetry version | awk '{print $2}')" >> $GITHUB_ENV
      - name: Bump alpha version
        # If triggered by push to the develop branch
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          poetry version prerelease
          echo "software_version=$(poetry version | awk '{print $2}')" >> $GITHUB_ENV
          echo "venue=sit" >> $GITHUB_ENV
      - name: Bump rc version
        # If triggered by push to a release branch
        if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
        env:
          # True if the version already has a 'rc' pre-release identifier
          BUMP_RC: ${{ contains(steps.get-version.outputs.current_version, 'rc') }}
        run: |
          if [ "$BUMP_RC" = true ]; then
            poetry version prerelease
          else
            poetry version ${GITHUB_REF#refs/heads/release/}rc1
          fi
          echo "software_version=$(poetry version | awk '{print $2}')" >> $GITHUB_ENV
          echo "venue=uat" >> $GITHUB_ENV
      - name: Release version
        # If triggered by push to the main branch
        if: ${{ startsWith(github.ref, 'refs/heads/main') }}
        env:
          CURRENT_VERSION: ${{ steps.get-version.outputs.current_version }}
        # Remove rc* from end of version string
        # The ${string%%substring} syntax below deletes the longest match of $substring from back of $string.
        run: |
          poetry version ${CURRENT_VERSION%%rc*}
          echo "software_version=$(poetry version | awk '{print $2}')" >> $GITHUB_ENV
          echo "venue=ops" >> $GITHUB_ENV
      - name: Install l2ss-py
        run: poetry install -E harmony
      - name: Lint
        run: |
          poetry run pylint podaac
          poetry run flake8 podaac
          poetry run ruff check podaac/
#       - name: Test and coverage
#         run: |
#           poetry run pytest -v \
#             --junitxml=build/reports/pytest.xml \
#             --cov=podaac \
#             --cov-report=xml:build/reports/coverage.xml \
#             --cov-report=term-missing:skip-covered \
#             -m "not aws and not integration" \
#             tests/
#       - name: SonarCloud Scan
#         id: sonarcloud
#         uses: sonarsource/sonarqube-scan-action@v8
#         env:
#           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#         with:
#           args: >
#             -Dsonar.organization=${{ github.repository_owner }}
#             -Dsonar.projectKey=${{ github.repository_owner }}_l2ss-py
#             -Dsonar.python.coverage.reportPaths=build/reports/coverage.xml
#             -Dsonar.sources=podaac/
#             -Dsonar.tests=tests/
#             -Dsonar.projectName=l2ss-py
#             -Dsonar.projectVersion=${{ env.software_version }}
#             -Dsonar.python.version=3.8,3.9,3.10
#         continue-on-error: true
#       - name: Wait to retry sonarcloud scan
#         if: steps.sonarcloud.outcome == 'failure'
#         run: |
#           sleep 40
#       - name: SonarCloud Scan Retry
#         id: sonarcloud-retry
#         if: steps.sonarcloud.outcome == 'failure'
#         uses: sonarsource/sonarqube-scan-action@v8
#         env:
#           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#         with:
#           args: >
#             -Dsonar.organization=${{ github.repository_owner }}
#             -Dsonar.projectKey=${{ github.repository_owner }}_l2ss-py
#             -Dsonar.python.coverage.reportPaths=build/reports/coverage.xml
#             -Dsonar.sources=podaac/
#             -Dsonar.tests=tests/
#             -Dsonar.projectName=l2ss-py
#             -Dsonar.projectVersion=${{ env.software_version }}
#             -Dsonar.python.version=3.8,3.9,3.10
      - name: Run Snyk as a blocking step
        uses: snyk/actions/python-3.12@master
        env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >
              --org=${{ secrets.SNYK_ORG_ID }}
              --project-name=${{ github.repository }}
              --severity-threshold=high
              --fail-on=all
      - name: Run Snyk on Python
        uses: snyk/actions/python-3.12@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: >
            --org=${{ secrets.SNYK_ORG_ID }}
            --project-name=${{ github.repository }}
      - name: Commit Version Bump
        # If building develop, a release branch, or main then we commit the version bump back to the repo
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/main'    ||
          startsWith(github.ref, 'refs/heads/release')
        run: |
          git config --global user.name 'l2ss-py bot'
          git config --global user.email 'l2ss-py@noreply.github.com'
          git commit -am "/version ${{ env.software_version }}"
          git push

      - name: Configure AWS credentials for UAT
        if: env.venue == 'uat'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CUMULUS_UAT }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CUMULUS_UAT }}
          aws-region: us-west-2

      - name: Configure AWS credentials for OPS
        if: env.venue == 'ops'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CUMULUS_OPS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CUMULUS_OPS }}
          aws-region: us-west-2

      - name: Get Lauchpad Token
        id: launchpad_token_generator
        if: |
          github.ref == 'refs/heads/main'    ||
          startsWith(github.ref, 'refs/heads/release')
        run: |
          OUTPUT_FILE=result.json

          PAYLOAD=$(echo '{"client_id": "L2SSpyGithubAction", "minimum_alive_secs": 300}' | base64)

          aws lambda invoke \
            --function-name ${{ env.venue }}-launchpad_token_dispenser \
            --payload "$PAYLOAD" \
            $OUTPUT_FILE > /dev/null 2>&1

          if jq -e 'has("errorMessage")' "$OUTPUT_FILE" > /dev/null; then
            echo "Error detected in Lambda response:"
            cat "$OUTPUT_FILE"
            exit 1
          fi

          RESULT=$(jq -r '.sm_token' < "$OUTPUT_FILE")
          echo "::add-mask::$RESULT"
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Publish UMM-S with new version
        id: publish-umm-s
        uses: podaac/cmr-umm-updater@0.8.0
        if: |
          github.ref == 'refs/heads/main'    ||
          startsWith(github.ref, 'refs/heads/release')
        with:
          umm-json: 'cmr/l2ss_cmr_umm_s.json'
          provider: 'POCLOUD'
          env: ${{ env.venue }}
          version: ${{ env.software_version }}
          timeout: 60
          disable_removal: 'true'
          umm_type: 'umm-s'
          use_associations: 'false'        
        env:
          LAUNCHPAD_TOKEN_SIT: ${{ steps.launchpad_token_generator.outputs.result }}
          LAUNCHPAD_TOKEN_UAT: ${{ steps.launchpad_token_generator.outputs.result }}
          LAUNCHPAD_TOKEN_OPS: ${{ steps.launchpad_token_generator.outputs.result }}

        continue-on-error: true
      - name: Wait to retry publishing umm-s
        if: steps.publish-umm-s.outcome == 'failure'
        run: |
          sleep 120
      - name: Publish UMM-S with new version retry
        id: publish-umm-s-retry
        uses: podaac/cmr-umm-updater@0.8.0
        if: |
          steps.publish-umm-s.outcome == 'failure'
        with:
          umm-json: 'cmr/l2ss_cmr_umm_s.json'
          provider: 'POCLOUD'
          env: ${{ env.venue }}
          version: ${{ env.software_version }}
          timeout: 60
          disable_removal: 'true'
          umm_type: 'umm-s'
          use_associations: 'false'        
        env:
          LAUNCHPAD_TOKEN_SIT: ${{ steps.launchpad_token_generator.outputs.result }}
          LAUNCHPAD_TOKEN_UAT: ${{ steps.launchpad_token_generator.outputs.result }}
          LAUNCHPAD_TOKEN_OPS: ${{ steps.launchpad_token_generator.outputs.result }}
      - name: Build Python Artifact
        run: |
          poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: python-artifact
          path: dist/*

      - name: Publish to test.pypi.org
        id: pypi-test-publish
        if: |
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/release')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to pypi.org
        if: |
          github.ref == 'refs/heads/main'
        id: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Log in to the Container registry
        if: |
          steps.pypi-test-publish.conclusion == 'success' ||
          steps.pypi-publish.conclusion == 'success'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        if: |
          steps.pypi-test-publish.conclusion == 'success' ||
          steps.pypi-publish.conclusion == 'success'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=pep440,pattern={{version}},value=${{ env.software_version }}
            type=raw,value=${{ env.venue }}
      - name: Wait for package
        if: |
          steps.pypi-test-publish.conclusion == 'success' ||
          steps.pypi-publish.conclusion == 'success'
        run: |
          pip install tenacity
          ${GITHUB_WORKSPACE}/.github/workflows/wait-for-pypi.py ${{env.pyproject_name}}[harmony]==${{ env.software_version }}
      - name: Build and push Docker image
        if: |
          steps.pypi-test-publish.conclusion == 'success' ||
          steps.pypi-publish.conclusion == 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            SOURCE=${{env.pyproject_name}}[harmony]==${{ env.software_version }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure AWS credentials for SIT
        if: env.venue == 'sit' && steps.pypi-test-publish.conclusion == 'success'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CUMULUS_SIT }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CUMULUS_SIT }}
          aws-region: us-west-2

      - name: Login to Amazon ECR (SIT)
        id: ecr-login
        if: env.venue == 'sit' && steps.pypi-test-publish.conclusion == 'success'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR (SIT)
        if: env.venue == 'sit' && steps.pypi-test-publish.conclusion == 'success'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          # Create the repository if it does not exist yet
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" > /dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPOSITORY}"

          # Retag the image already pushed to GHCR (version and venue tags) and push to ECR
          for tag in "${{ env.software_version }}" "${{ env.venue }}"; do
            docker pull "${REGISTRY}/${IMAGE_NAME}:${tag}"
            docker tag "${REGISTRY}/${IMAGE_NAME}:${tag}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
            docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
          done

      - name: Run Snyk on Docker Image
        # Use the modern `snyk container test` subcommand directly instead of the
        # snyk/actions/docker action. That action runs legacy `snyk test --docker`,
        # which (a) executes inside a container with no `python`, tripping over the
        # repo's pyproject.toml, and (b) mishandles `--file`, treating the Dockerfile
        # as an open-source manifest ("Could not detect package manager").
        # `snyk container test` targets only the image, reads the Dockerfile via
        # --file for base-image upgrade advice, and reliably writes SARIF for upload
        # to GitHub Code Scanning. continue-on-error keeps a vulnerable image (or a
        # scan error) from failing the build.
        continue-on-error: true
        if: ${{ (steps.pypi-test-publish.conclusion == 'success' || steps.pypi-publish.conclusion == 'success') && steps.meta.outputs.tags != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          IMAGE_URI="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          snyk container test "$IMAGE_URI" \
            --file=docker/Dockerfile \
            --severity-threshold=high \
            --sarif-file-output=snyk.sarif

      - name: Normalize Snyk SARIF for GitHub Code Scanning
        # Snyk emits some rules (e.g. license findings) with a null
        # "security-severity", which GitHub Code Scanning rejects during processing
        # ("invalid security severity value, is not a number: null"). Coerce any
        # null/"undefined" value to "0" so the SARIF is accepted.
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        run: |
          jq '(.runs[]?.tool.driver.rules[]?.properties."security-severity") |= (if (. == null or . == "undefined") then "0" else . end)' \
            snyk.sarif > snyk.sarif.tmp && mv snyk.sarif.tmp snyk.sarif
      
      - name: Upload Snyk result to GitHub Code Scanning
        # Always attempt to upload, even if the Snyk scan found vulnerabilities and
        # exited non-zero. Guarded on the SARIF file existing so that a scan which
        # fails to produce output does not fail the whole job.
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

      - name: Push Tag
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/main'    ||
          startsWith(github.ref, 'refs/heads/release')
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "${{ env.software_version }}" -m "Version ${{ env.software_version }}"
          git push origin "${{ env.software_version }}"

      - name: Build Docs
        if: |
          github.ref == 'refs/heads/main'
        run: |
          poetry run sphinx-build -b html ./docs docs/_build/

      - name: Prepare combined folder for deploy
        if: |
          github.ref == 'refs/heads/main'
        run: |
          mkdir -p deploy_dir/${{ env.software_version }}
          cp -r docs/_build/* deploy_dir/${{ env.software_version }}/
          cp -r docs/_build/* deploy_dir/

      - name: Deploy combined docs
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy_dir
          clean: false

      - name: Deploy Harmony
        env:
            ENV: ${{ env.venue }}
            CMR_USER: ${{ secrets.CMR_USER }}
            CMR_PASS: ${{ secrets.CMR_PASS }}
        if: |
          github.ref == 'refs/heads/main'    ||
          startsWith(github.ref, 'refs/heads/release')
        working-directory: deployment
        run: 
          poetry run python harmony_deploy.py --tag ${{ env.software_version }} 

      - name: Create Release
        id: create_release
        if: |
          github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.software_version }}  # Use the tag that triggered the action
          name: Release v${{ env.software_version }}
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Triggered by a push whose commit message starts with "/deploy sit". Publishes the PR to
  # test.pypi.org, builds the Docker image and pushes it to GHCR and SIT ECR.
  # Does NOT run tests/scans and does NOT deploy to Harmony.
  # NOTE: lives in this file (not a new one) so PyPI trusted publishing still matches.
  deploy-sit:
    name: Deploy PR to SIT (PyPI test + image + ECR)
    if: |
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, '/deploy sit')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    env:
      venue: sit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 2.3.2
      - name: Set unique test version
        # PyPI never allows re-uploading a version, so make each run unique
        run: |
          base=$(poetry version -s | sed -E 's/(a|b|rc|\.dev)[0-9]*$//')
          poetry version "${base}.dev${{ github.run_number }}${{ github.run_attempt }}"
          echo "software_version=$(poetry version -s)" >> $GITHUB_ENV
          echo "pyproject_name=$(poetry version | awk '{print $1}')" >> $GITHUB_ENV
      - name: Build Python Artifact
        run: poetry build
      - name: Publish to test.pypi.org
        id: pypi-test-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Version tag only, so the develop "sit" tag is not overwritten
          tags: |
            type=raw,value=${{ env.software_version }}
      - name: Wait for package
        run: |
          pip install tenacity
          ${GITHUB_WORKSPACE}/.github/workflows/wait-for-pypi.py ${{env.pyproject_name}}[harmony]==${{ env.software_version }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            SOURCE=${{env.pyproject_name}}[harmony]==${{ env.software_version }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Configure AWS credentials for SIT
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SERVICES_SIT }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SERVICES_SIT }}
          aws-region: us-west-2

      - name: Login to Amazon ECR (SIT)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push Docker image to ECR (SIT)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" > /dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPOSITORY}"
          tag="${{ env.software_version }}"
          docker pull "${REGISTRY}/${IMAGE_NAME}:${tag}"
          docker tag "${REGISTRY}/${IMAGE_NAME}:${tag}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
